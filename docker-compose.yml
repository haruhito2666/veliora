services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: veliora-postgres
    environment:
      POSTGRES_USER: veliora
      POSTGRES_PASSWORD: veliora
      POSTGRES_DB: veliora
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veliora"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10
    container_name: veliora-nats
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: veliora-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  natsdata:
