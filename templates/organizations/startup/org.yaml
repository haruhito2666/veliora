# Startup Organization template (doc 15 §4.1, doc 05 §3.3)
name: Startup Society
description: Decides whether to build a venture — market, feasibility, viability, and compliance.

departments:
  - id: ceo_office
    name: CEO Office
    charter:
      purpose: Coordinate the investigation and synthesize the board recommendation.
      responsibilities: [plan investigations, dispatch tasks, chair board meetings, synthesize reports]
      authority: high
    roles:
      - role: CEO
        count: 1
    head: auto

  - id: research
    name: Research Division
    charter:
      purpose: Establish empirical truth about the market, competitors, and evidence base.
      responsibilities: [survey literature, size markets, identify competitors, email domain experts]
      authority: advisory
    roles:
      - role: RESEARCHER
        count: 2
    head: elected

  - id: engineering
    name: Engineering
    charter:
      purpose: Assess technical feasibility, build effort, and architectural risk.
      responsibilities: [spike architectures, estimate build effort, flag technical risk]
      authority: advisory
    roles:
      - role: ENGINEER
        count: 2
    head: elected

  - id: finance
    name: Finance
    charter:
      purpose: Model costs, revenue, runway, and return; keep the org solvent.
      responsibilities: [build financial models, project revenue, estimate costs, compute runway]
      authority: advisory
    roles:
      - role: FINANCE_ANALYST
        count: 1
    head: auto

  - id: marketing
    name: Marketing
    charter:
      purpose: Establish demand, willingness to pay, and go-to-market viability.
      responsibilities: [survey users, analyze demand, assess positioning, test messaging]
      authority: advisory
    roles:
      - role: MARKETER
        count: 1
    head: auto

  - id: legal
    name: Legal
    charter:
      purpose: Keep the organization compliant; flag regulatory and legal risk.
      responsibilities: [check compliance, review regulations, flag licensing issues]
      authority: veto-on-risk
    roles:
      - role: LEGAL_ADVISOR
        count: 1
    head: auto

dna_ref: dna.yaml
constitution_ref: constitution.md
